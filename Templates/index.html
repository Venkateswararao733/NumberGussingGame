<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #f4f4f4;
        }
        input {
            padding: 10px;
            width: 200px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: darkblue;
        }
        .msg {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>
<body>

<h1>🎯 Number Guessing Game</h1>

<form method="POST">
    <input type="number" name="guess" placeholder="Enter 1-100" required>
    <br><br>
    <button type="submit">Guess</button>
</form>

<div class="msg">
    {{ message }}
</div>

</body>
</html>
